<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacular Loader — colour cycle playground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#FAFAF8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#1F1F1F; padding:28px 16px 48px; }
  h1 { font-size:17px; font-weight:600; text-align:center; margin-bottom:4px; }
  .sub { font-size:13px; color:#8a8a86; text-align:center; margin-bottom:26px; }
  .grid { display:flex; flex-wrap:wrap; gap:22px; justify-content:center; max-width:1180px; margin:0 auto; }
  .card { background:#fff; border:1px solid #ececea; border-radius:14px; padding:18px 18px 14px; width:260px; }
  .card h2 { font-size:14px; font-weight:600; margin-bottom:2px; }
  .card .desc { font-size:12px; color:#8a8a86; line-height:1.45; min-height:50px; margin-bottom:6px; }
  .stage { width:100%; aspect-ratio:1; }
  .swatches { display:flex; gap:3px; margin-top:8px; flex-wrap:wrap; }
  .swatches i { display:block; width:14px; height:14px; border-radius:4px; }
  .fam { font-size:11px; color:#b0b0ac; margin-top:6px; height:14px; }
</style>
</head>
<body>
<h1>Tacular loader — colour cycle options</h1>
<div class="sub">Same motion in every card. Only the colour sequence and change rate differ.</div>
<div style="text-align:center;margin-bottom:22px;">
  <button id="reload" style="font:13px/1 -apple-system,BlinkMacSystemFont,sans-serif;padding:9px 18px;border-radius:8px;border:1px solid #e0e0dc;background:#fff;cursor:pointer;">Simulate a fresh load (random start)</button>
</div>
<div class="grid" id="grid"></div>

<script>
// ── palette: the app's 30 theme families, deep (L44) step ──
const FAMILIES = [
  ['red',0,72],['scarlet',6,44],['crimson',12,50],['orange',25,78],['tangerine',32,44],
  ['amber',37,50],['yellow',48,68],['gold',55,44],['chartreuse',62,50],['lime',75,48],
  ['fern',95,50],['sage',108,66],['green',120,42],['pine',140,50],['juniper',150,66],
  ['teal',158,46],['cyan',178,50],['aqua',186,66],['sky',195,58],['cerulean',207,50],
  ['denim',213,66],['blue',220,62],['cobalt',232,66],['indigo',243,50],['violet',265,55],
  ['grape',275,66],['plum',285,50],['magenta',320,50],['blush',330,44],['rose',340,65],
]; // sorted by hue
const deep = ([n,h,s]) => ({ name:n, css:`hsl(${h},${s}%,44%)`, h, s });
const pick = names => names.map(n => deep(FAMILIES.find(f=>f[0]===n)));

const ORIGINAL = [
  {name:'blue', css:'#2B59B6'}, {name:'rose', css:'#D4356A'},
  {name:'green', css:'#419F41'}, {name:'orange', css:'#C86219'},
];

const VARIANTS = [
  { title:'A — Current (4 colours)', changeEvery:2, seq:ORIGINAL,
    desc:'What you have now, for reference. Full cycle every 5s loop.' },
  { title:'B — 6 colours', changeEvery:2, seq:pick(['red','orange','green','teal','blue','rose']),
    desc:'Six well-spaced families. Sequence carries across loops — full cycle in 1.5 loops (7.5s).' },
  { title:'C — 8 colours', changeEvery:2, seq:pick(['red','orange','gold','green','teal','blue','violet','rose']),
    desc:'Eight families round the wheel. Full cycle in 2 loops (10s).' },
  { title:'D — 12 colours', changeEvery:2, seq:pick(['red','orange','yellow','lime','green','juniper','teal','sky','blue','indigo','grape','rose']),
    desc:'Twelve families — hops are small enough that it starts to feel like a drift. Full cycle in 3 loops (15s).' },
  { title:'E — Full 30-family walk', changeEvery:2, seq:FAMILIES.map(deep),
    desc:'Every theme family in hue order, one step per flip. A slow rainbow drift, ~37.5s all the way round.' },
];

// ── animation maths (ported from the loader) ──
const CARDINALS=[0,90,180,270], CORNERS=[45,135,225,315];
const HOLD=0.45, LOOP=5000, TICK=LOOP/8;
const lerp=(a,b,t)=>a+(b-a)*t;
function softBounce(u){const c1=1,c2=c1*1.525;return u<.5?(Math.pow(2*u,2)*((c2+1)*2*u-c2))/2:(Math.pow(2*u-2,2)*((c2+1)*(u*2-2)+c2)+2)/2;}
const mv=f=>f<HOLD?0:softBounce((f-HOLD)/(1-HOLD));

function colourAt(seq, changeEvery, seg, frac){
  const grp=Math.floor(seg/changeEvery), inGrp=seg%changeEvery;
  const c0=seq[grp%seq.length], c1=seq[(grp+1)%seq.length];
  if(inGrp!==changeEvery-1||frac<HOLD) return [c0.css,c0.name];
  const t=(frac-HOLD)/(1-HOLD);
  return [`color-mix(in srgb, ${c1.css} ${Math.round(t*100)}%, ${c0.css})`, t>.5?c1.name:c0.name];
}

function makeCard(v){
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<h2>${v.title}</h2><div class="desc">${v.desc}</div>
    <svg class="stage" viewBox="0 0 200 200">
      <g class="tGrp"><path d="M30-450L30-640L1070-640L1070-450L30-450M425 0L425-463L675-463L675 0" transform="translate(69.75,117.6) scale(0.055)"/></g>
      <g class="dotGrp"><circle cx="0" cy="-61" r="8"/></g>
      <g class="ring" transform="translate(100,100)"></g>
    </svg>
    <div class="swatches">${v.seq.map(c=>`<i style="background:${c.css}" title="${c.name}"></i>`).join('')}</div>
    <div class="fam"></div>`;
  document.getElementById('grid').appendChild(card);
  const ring=card.querySelector('.ring');
  CARDINALS.forEach(a=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',-8);r.setAttribute('y',-92);r.setAttribute('width',16);r.setAttribute('height',39);r.setAttribute('rx',8);
    r.setAttribute('transform',`rotate(${a})`);ring.appendChild(r);});
  const cornerRects=CORNERS.map(()=>[0,1].map(()=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');ring.appendChild(r);return r;}));
  return {v, card, tGrp:card.querySelector('.tGrp'), dotGrp:card.querySelector('.dotGrp'),
    svg:card.querySelector('.stage'), fam:card.querySelector('.fam'), cornerRects};
}

const cards=VARIANTS.map(makeCard);
let t0=performance.now();
let segOffset=0;
document.getElementById('reload').addEventListener('click',()=>{
  // what a fresh mount would do: random colour position + random point in the loop
  t0=performance.now()-Math.random()*TICK;
  segOffset=Math.floor(Math.random()*60)*2; // even offset keeps flip/morph parity
});
function frame(now){
  const t=now-t0;
  const seg=Math.floor(t/TICK)+segOffset, frac=(t%TICK)/TICK;
  const m=mv(frac);
  const morph=(seg%2===0)?m:1-m;                       // spark(0) <-> clock(1)
  const dotAngle=(seg%8)*45+45*m;
  const flip=(seg%2===1)?Math.cos(Math.PI*m):1;        // T revolving door on odd ticks
  for(const c of cards){
    const [ink,famName]=colourAt(c.v.seq,c.v.changeEvery,seg,frac);
    c.tGrp.setAttribute('transform',`translate(100,100) scale(${0.86*flip},0.86) translate(-100,-100)`);
    c.dotGrp.setAttribute('transform',`translate(100,100) rotate(${dotAngle})`);
    for(const el of c.svg.querySelectorAll('path,rect,circle')) el.setAttribute('fill',ink);
    c.cornerRects.forEach((pair,i)=>{
      const cAng=CORNERS[i], w=lerp(16,13,morph), len=lerp(28,20,morph);
      const a1=lerp(cAng,cAng-15,morph), a2=lerp(cAng,cAng+15,morph);
      pair.forEach((r,j)=>{const a=j===0?a1:a2;
        r.setAttribute('x',-w/2);r.setAttribute('y',-92);r.setAttribute('width',w);
        r.setAttribute('height',len);r.setAttribute('rx',w/2);r.setAttribute('transform',`rotate(${a})`);});
    });
    c.fam.textContent=famName;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
